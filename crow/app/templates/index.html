<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Crow Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <header class="header">

        <div class="logo-container">

            <img
                src="{{ url_for('static', filename='logo.png') }}"
                alt="Crow Logo"
                class="logo"
                onerror="this.style.display='none'"
            >

            <div>

                <h1>Crow Dashboard</h1>

                <p>
                    Monitoramento Automático de Containers Docker
                </p>

            </div>

        </div>

    </header>

    <div class="grid-top">

        <div class="card">

            <h2>Controle do Monitoramento</h2>

            <div
                id="status-card"
                class="status parado"
            >

                <span id="status-monitoramento">
                    Parado
                </span>

            </div>

            <label>
                Intervalo (segundos)
            </label>

            <input
                type="number"
                id="intervalo"
                value="30"
                min="1"
            >

            <div class="buttons">

                <button
                    class="btn-start"
                    onclick="iniciarMonitoramento()"
                >
                    Iniciar
                </button>

                <button
                    class="btn-stop"
                    onclick="pararMonitoramento()"
                >
                    Parar
                </button>

            </div>

        </div>

        <div class="card">

            <h2>Imagens Monitoradas</h2>

            <div class="image-form">

                <input
                    type="text"
                    id="nova-imagem"
                    placeholder="nginx:latest"
                >

                <button onclick="adicionarImagem()">
                    Adicionar
                </button>

            </div>

            <ul id="images-list"></ul>

        </div>

    </div>

    <div class="grid-bottom">

        <div class="card">

            <h2>Containers</h2>

            <table id="containers-table">

                <thead>

                    <tr>
                        <th>Nome</th>
                        <th>Status</th>
                        <th>Imagem</th>
                    </tr>

                </thead>

                <tbody></tbody>

            </table>

        </div>

        <div class="card">

            <h2>Logs do Sistema</h2>

            <div id="logs-box"></div>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>

</body>
</html>
